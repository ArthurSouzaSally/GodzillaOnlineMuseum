<!DOCTYPE html>
<html>
  <head>
    <title>Godzilla Online Museum</title>
    <style>
      @keyframes padrao{
        from{opacity:0.0;}
        to{opacity:1.0;}
      }
      body{background:rgb(0,0,0);animation:padrao 6s;}
      :not(p){color:white;font-family:monospace;text-shadow:0px 0px 3px white,0px 0px 5px white;}
    </style>
  </head>
  <body>
    <!-- Título -->
    <div style="position:absolute;top:0px;left:0px;right:0px;bottom:0px;display:flex;align-items:center;justify-content:center;flex-direction:column;" id="pagina000">
      <img src="assets/asset_001.webp" style="width:min(100%,500px);"/>
      <span style="font-size:min(2vh,2vw);">Online Godzilla Fan Museum</span>
    </div>
    <!-- Página 001 -->
    <div style="position:absolute;top:100vh;left:0px;right:0px;bottom:-100vh;display:flex;align-items:center;justify-content:center;flex-direction:row;" id="pagina001">
      <div style="margin-right:1vw;display:flex;flex-direction:column;" style="width:min(40vh,40vw);" align="center">
        <img src="assets/asset_002.webp" style="width:min(40vh,40vw);"/>
        Design Original do Godzilla<br/>
        (estimativa feita por fãs)
      </div>
      <div style="margin-left:1vw;display:flex;flex-direction:column;" style="width:min(40vh,40vw);" align="center">
        <img src="assets/asset_003.webp" style="width:min(40vh,40vw);"/>
        Design Final do Godzilla<br/>
        (filme da Toho de 1954)
      </div>
    </div>
    <!-- Página 002 -->
    <div style="position:absolute;top:200vh;left:0px;right:0px;bottom:-200vh;display:flex;align-items:center;justify-content:center;flex-direction:row;" id="pagina002">
      <div style="display:flex;flex-direction:row;">
        <span style="font-size:5vh;">Era Showa</span>
        <span>(1954-1975)</span>
      </div>
    </div>
    <!-- Página 003 -->
    <div style="position:absolute;top:300vh;left:0px;right:0px;bottom:-300vh;display:flex;align-items:center;justify-content:center;flex-direction:row;" id="pagina003">
      <div style="display:flex;flex-direction:row;">
        <span style="font-size:5vh;">Era Heisei</span>
        <span>(1984-1995)</span>
      </div>
    </div>
    <!-- Página 004 -->
    <div style="position:absolute;top:400vh;left:0px;right:0px;bottom:-400vh;display:flex;align-items:center;justify-content:center;flex-direction:row;" id="pagina004">
      <div style="display:flex;flex-direction:row;">
        <span style="font-size:5vh;">Era Millennium</span>
        <span>(1999-2004)</span>
      </div>
    </div>
    <!-- Página 005 -->
    <div style="position:absolute;top:500vh;left:0px;right:0px;bottom:-500vh;display:flex;align-items:center;justify-content:center;flex-direction:row;" id="pagina005">
      <div style="display:flex;flex-direction:row;">
        <span style="font-size:5vh;">Era Reiwa</span>
        <span>(2016-Agora!)</span>
      </div>
    </div>
  </body>
</html>
